# Project-local Apache config for JohnsonChat integration tests.
# Start with:
#   /c/xampp/apache/bin/httpd.exe -f tests/apache/httpd.conf -DFOREGROUND
# Serves only http://127.0.0.1:8080 and leaves XAMPP's global config untouched.

ServerRoot "C:/xampp/apache"
Listen 127.0.0.1:8080
ServerName 127.0.0.1:8080
PidFile "D:/projects/Johnson Chat/tests/apache/httpd.pid"

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule headers_module modules/mod_headers.so
LoadModule alias_module modules/mod_alias.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule setenvif_module modules/mod_setenvif.so

LoadFile "C:/xampp/php/php8ts.dll"
LoadFile "C:/xampp/php/libsqlite3.dll"
# php_curl.dll needs brotlidec.dll; Apache's bin has brotlicommon but not brotlidec.
LoadFile "C:/xampp/php/brotlidec.dll"
LoadModule php_module "C:/xampp/php/php8apache2_4.dll"

<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>
PHPINIDir "C:/xampp/php"

DocumentRoot "D:/projects/Johnson Chat"
<Directory "D:/projects/Johnson Chat">
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

DirectoryIndex index.php index.html
TypesConfig conf/mime.types
# TRACE is handled by core before per-directory config; it must be disabled here.
TraceEnable Off

ErrorLog "D:/projects/Johnson Chat/tests/apache/error.log"
LogLevel warn
CustomLog "D:/projects/Johnson Chat/tests/apache/access.log" common
